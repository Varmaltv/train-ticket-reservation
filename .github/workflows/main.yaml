
name: Tomcat CI/CD Pipeline

on:
  push:
    branches:
      - master

  workflow_dispatch:

jobs:

  # Build Java application
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Maven Build
        run: mvn clean package

      - name: Verify WAR File
        run: test -f target/*.war

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v5
        with:
          name: trainticket-war
          path: target/*.war
       

  # Deploy to DEV
  deploy_dev:
    name: Deploy to DEV
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: dev

  # Deploy to QA
  deploy_qa:
    name: Deploy to QA
    needs: deploy_dev
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: qa

  # Deploy to PREPROD
  deploy_preprod:
    name: Deploy to PREPROD
    needs: deploy_qa
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: preprod

  # Deploy to PROD
  deploy_prod:
    name: Deploy to PROD
    needs: deploy_preprod
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: prod


      

         

   

       




          
         
       
