
name: Reusable Tomcat Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:

      # Download WAR file
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainticket-war
          path: artifact

      # Configure SSH using GitHub secrets
      - name: Configure SSH
        env:
          SSH_KEY: ${{ secrets.TOMCAT_SSH_KEY }}
          SSH_HOST: ${{ secrets.TOMCAT_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh

          echo "$SSH_KEY" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          echo "$SSH_HOST" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      # Copy WAR file to Tomcat server
      - name: Copy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ vars.TOMCAT_HOST }}
          TOMCAT_USER: ${{ vars.TOMCAT_USER }}
          TOMCAT_PORT: ${{ vars.TOMCAT_PORT }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          scp -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            -P "$TOMCAT_PORT" \
            artifact/trainticket-war \
            "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"

      # Deploy WAR file to Tomcat
      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ vars.TOMCAT_HOST }}
          TOMCAT_USER: ${{ vars.TOMCAT_USER }}
          TOMCAT_PORT: ${{ vars.TOMCAT_PORT }}
          APP_NAME: ${{ vars.APP_NAME }}
        run: |
          ssh -i ~/.ssh/id_rsa \
            -o StrictHostKeyChecking=yes \
            -p "$TOMCAT_PORT" \
            "$TOMCAT_USER@$TOMCAT_HOST" \
            "WEBAPPS=\$(find /opt /usr/local -type d -name webapps 2>/dev/null | head -n 1);
             test -n \"\$WEBAPPS\" || exit 1;
             mv /tmp/$APP_NAME.war \"\$WEBAPPS/$APP_NAME.war\""

          echo "WAR deployment completed!"

      # Display application URL
      - name: Application URL
        env:
          APP_URL: ${{ vars.APP_URL }}
        run: |
          echo "Environment: ${{ inputs.environment }}"
          echo "Application URL: $APP_URL"
