
name: Reusable Tomcat Deployment

on:
  workflow_call:
    inputs:
      environment:
        description: "Deployment environment"
        required: true
        type: string

jobs:
  deploy:
    name: Deploy to ${{ inputs.environment }}
    runs-on: ubuntu-latest

    environment: ${{ inputs.environment }}

    steps:

      # Download WAR artifact
      - name: Download WAR Artifact
        uses: actions/download-artifact@v4
        with:
          name: trainticket-war
          path: artifact

      # Configure SSH private key
      - name: Configure SSH
        uses: webfactory/ssh-agent@v0.9.0
        with:
          TOMCAT_SSH_KEY: ${{ secrets.TOMCAT_SSH_KEY }}

      # Configure verified SSH host key
      - name: Configure SSH Host Verification
        env:
          TOMCAT_KNOWN_HOSTS: ${{ secrets.TOMCAT_KNOWN_HOSTS }}

        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh

          printf '%s\n' "$TOMCAT_KNOWN_HOSTS" > ~/.ssh/known_hosts

          chmod 600 ~/.ssh/known_hosts

      # Copy WAR file to Tomcat server
      - name: Copy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ vars.TOMCAT_HOST }}
          TOMCAT_USER: ${{ vars.TOMCAT_USER }}
          TOMCAT_PORT: ${{ vars.TOMCAT_PORT }}
          APP_NAME: ${{ vars.APP_NAME }}

        run: |
          scp -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -P "$TOMCAT_PORT" \
              artifact/*.war \
              "$TOMCAT_USER@$TOMCAT_HOST:/tmp/$APP_NAME.war"

      # Automatically find webapps and deploy WAR
      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_HOST: ${{ vars.TOMCAT_HOST }}
          TOMCAT_USER: ${{ vars.TOMCAT_USER }}
          TOMCAT_PORT: ${{ vars.TOMCAT_PORT }}
          APP_NAME: ${{ vars.APP_NAME }}

        run: |
          ssh -o StrictHostKeyChecking=yes \
              -o UserKnownHostsFile="$HOME/.ssh/known_hosts" \
              -p "$TOMCAT_PORT" \
              "$TOMCAT_USER@$TOMCAT_HOST" \
              "WEBAPPS=\$(find /opt /usr/local -type d -name webapps 2>/dev/null | head -n 1);
               test -n \"\$WEBAPPS\" || exit 1;
               mv /tmp/$APP_NAME.war \"\$WEBAPPS/$APP_NAME.war\""

          echo "WAR deployment completed successfully"

      # Display application URL
      - name: Application URL
        env:
          APP_URL: ${{ vars.APP_URL }}

        run: |
          echo "Deployment completed successfully"
          echo "Environment: ${{ inputs.environment }}"
          echo "Application URL: $APP_URL"
