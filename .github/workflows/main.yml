name: ci-cd pipeline

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build WAR
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Java
        uses: actions/setup-java@v4
        with:
          java-version: "8"
          distribution: temurin
          cache: maven

      - name: Build WAR
        run: mvn clean verify

      - name: Verify WAR
        run: |
          test -f target/TrainBook-1.0.0-SNAPSHOT.war
          unzip -t target/TrainBook-1.0.0-SNAPSHOT.war

      - name: Upload WAR
        uses: actions/upload-artifact@v4
        with:
          name: war-file
          path: target/TrainBook-1.0.0-SNAPSHOT.war
          if-no-files-found: error

  dev:
    name: Deploy to DEV
    needs: build
    runs-on: ubuntu-latest
    environment: dev

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: war

      - name: Deploy to DEV Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -euo pipefail

          TOMCAT_URL="${TOMCAT_URL%/}"

          if [[ -z "$TOMCAT_URL" ]]; then
            echo "::error::TOMCAT_URL is not configured for the dev environment"
            exit 1
          fi

          if [[ "$TOMCAT_URL" != http://* && "$TOMCAT_URL" != https://* ]]; then
            echo "::error::TOMCAT_URL must begin with http:// or https://"
            exit 1
          fi

          if [[ -z "$TOMCAT_USERNAME" || -z "$TOMCAT_PASSWORD" ]]; then
            echo "::error::Tomcat credentials are not configured for the dev environment"
            exit 1
          fi

          curl --fail-with-body --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file war/TrainBook-1.0.0-SNAPSHOT.war \
            "$TOMCAT_URL/manager/text/deploy?path=/TrainBook&update=true"

  qa:
    name: Deploy to QA
    needs: dev
    runs-on: ubuntu-latest
    environment: qa

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: war

      - name: Deploy to QA Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -euo pipefail

          TOMCAT_URL="${TOMCAT_URL%/}"

          if [[ -z "$TOMCAT_URL" ]]; then
            echo "::error::TOMCAT_URL is not configured for the qa environment"
            exit 1
          fi

          if [[ "$TOMCAT_URL" != http://* && "$TOMCAT_URL" != https://* ]]; then
            echo "::error::TOMCAT_URL must begin with http:// or https://"
            exit 1
          fi

          if [[ -z "$TOMCAT_USERNAME" || -z "$TOMCAT_PASSWORD" ]]; then
            echo "::error::Tomcat credentials are not configured for the qa environment"
            exit 1
          fi

          curl --fail-with-body --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file war/TrainBook-1.0.0-SNAPSHOT.war \
            "$TOMCAT_URL/manager/text/deploy?path=/TrainBook&update=true"

  preprod:
    name: Deploy to PREPROD
    needs: qa
    runs-on: ubuntu-latest
    environment: preprod

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: war

      - name: Deploy to PREPROD Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -euo pipefail

          TOMCAT_URL="${TOMCAT_URL%/}"

          if [[ -z "$TOMCAT_URL" ]]; then
            echo "::error::TOMCAT_URL is not configured for the preprod environment"
            exit 1
          fi

          if [[ "$TOMCAT_URL" != http://* && "$TOMCAT_URL" != https://* ]]; then
            echo "::error::TOMCAT_URL must begin with http:// or https://"
            exit 1
          fi

          if [[ -z "$TOMCAT_USERNAME" || -z "$TOMCAT_PASSWORD" ]]; then
            echo "::error::Tomcat credentials are not configured for the preprod environment"
            exit 1
          fi

          curl --fail-with-body --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file war/TrainBook-1.0.0-SNAPSHOT.war \
            "$TOMCAT_URL/manager/text/deploy?path=/TrainBook&update=true"

  prod:
    name: Deploy to PROD
    needs: preprod
    runs-on: ubuntu-latest
    environment: prod

    steps:
      - name: Download WAR
        uses: actions/download-artifact@v4
        with:
          name: war-file
          path: war

      - name: Deploy to PROD Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USERNAME: ${{ secrets.TOMCAT_USERNAME }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -euo pipefail

          TOMCAT_URL="${TOMCAT_URL%/}"

          if [[ -z "$TOMCAT_URL" ]]; then
            echo "::error::TOMCAT_URL is not configured for the prod environment"
            exit 1
          fi

          if [[ "$TOMCAT_URL" != http://* && "$TOMCAT_URL" != https://* ]]; then
            echo "::error::TOMCAT_URL must begin with http:// or https://"
            exit 1
          fi

          if [[ -z "$TOMCAT_USERNAME" || -z "$TOMCAT_PASSWORD" ]]; then
            echo "::error::Tomcat credentials are not configured for the prod environment"
            exit 1
          fi

          curl --fail-with-body --show-error \
            --user "$TOMCAT_USERNAME:$TOMCAT_PASSWORD" \
            --upload-file war/TrainBook-1.0.0-SNAPSHOT.war \
            "$TOMCAT_URL/manager/text/deploy?path=/TrainBook&update=true"
