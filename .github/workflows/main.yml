
name: CI-CD Pipeline - Train Booking

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:

  # JOB 1 - BUILD
  build:
    name: Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Validate with Maven
        run: mvn validate

      - name: Compile with Maven
        run: mvn compile

      - name: Test with Maven
        run: mvn test

      - name: Package with Maven
        run: mvn clean package -DskipTests

      - name: Prepare WAR
        run: |
          mkdir -p deploy
          WAR_FILE=$(find target -maxdepth 1 -name "*.war" -print -quit)

          if [ -z "$WAR_FILE" ]; then
            echo "ERROR: WAR file not found"
            exit 1
          fi

          cp "$WAR_FILE" deploy/train-booking.war
          ls -lh deploy/

      - name: Upload WAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: train-booking-war
          path: deploy/train-booking.war
          if-no-files-found: error

  # JOB 2 - DEV
  deploy-dev:
    name: Deploy DEV
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: DEV
    secrets: inherit

  # JOB 3 - TEST
  deploy-test:
    name: Deploy TEST
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: TEST
    secrets: inherit

  # JOB 4 - PRE-PROD
  deploy-preprod:
    name: Deploy PREPROD
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: PRE-PROD
    secrets: inherit

  # JOB 5 - PROD
  deploy-prod:
    name: Deploy PROD
    needs: build
    uses: ./.github/workflows/reusable-deploy.yml
    with:
      environment: PROD
    secrets: inherit




 
