name: Java CI-CD Pipeline

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven

      - name: Maven Clean Test
        run: mvn clean test

      - name: Build WAR
        run: mvn package -DskipTests

      - name: SonarQube Analysis
        uses: SonarSource/sonarqube-scan-action@v5
        with:
          args: >
            -Dsonar.projectKey=train-ticket-reservation
            -Dsonar.projectName=train-ticket-reservation
            -Dsonar.sources=src/main/java
            -Dsonar.tests=src/test/java
            -Dsonar.java.binaries=target/classes
            -Dsonar.java.test.binaries=target/test-classes
        env:
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}

      - name: Upload WAR to Nexus
        env:
          NEXUS_URL: ${{ secrets.NEXUS_URL }}
          NEXUS_USERNAME: ${{ secrets.NEXUS_USERNAME }}
          NEXUS_PASSWORD: ${{ secrets.NEXUS_PASSWORD }}
        run: |
          set -e
          WAR_FILE=$(find target -maxdepth 1 -name "*.war" | head -n 1)
          test -n "$WAR_FILE" || { echo "No WAR file found in target/"; exit 1; }

          curl -f -u "$NEXUS_USERNAME:$NEXUS_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "$NEXUS_URL/$(basename "$WAR_FILE")"

      - name: Deploy WAR to Tomcat
        env:
          TOMCAT_URL: ${{ secrets.TOMCAT_URL }}
          TOMCAT_USER: ${{ secrets.TOMCAT_USER }}
          TOMCAT_PASSWORD: ${{ secrets.TOMCAT_PASSWORD }}
        run: |
          set -e
          WAR_FILE=$(find target -maxdepth 1 -name "*.war" | head -n 1)
          test -n "$WAR_FILE" || { echo "No WAR file found in target/"; exit 1; }

          APP_NAME=$(basename "$WAR_FILE" .war)

          curl -f -u "$TOMCAT_USER:$TOMCAT_PASSWORD" \
            --upload-file "$WAR_FILE" \
            "$TOMCAT_URL/manager/text/deploy?path=/$APP_NAME&update=true"

